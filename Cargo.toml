[package]
name = "marmot-snapshot-bug"
version = "0.1.0"
edition = "2021"
description = "Minimal reproduction of MDK epoch snapshot group_id format mismatch bug"

[dependencies]
mdk-storage-traits = { git = "https://github.com/marmot-protocol/mdk.git", rev = "fe69c3e50e4a66755ed4f04d34f5453c1ac6fd5f" }
mdk-sqlite-storage = { git = "https://github.com/marmot-protocol/mdk.git", rev = "fe69c3e50e4a66755ed4f04d34f5453c1ac6fd5f" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
